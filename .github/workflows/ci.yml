name: Rust and React checks

on:
  push:
    branches: [main, Judy, Doris, Bella, Tingting]
    paths-ignore: ['docs/**', 'wiki/**', '*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'wiki/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check frontend and Wiki publisher
        run: |
          npm ci
          npm test
          npm run build
          bash -n scripts/publish-wiki.sh
      - name: Check Rust and API integration
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
          cargo +stable build --locked
          npm run test:api
